<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VARKA — вид сверху</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans+Narrow:wght@400;700&display=swap">
<link rel="stylesheet" href="kpk.css">
<style>
/* 2D: раскладка. Палитра, шрифты, кнопки, карточки отрядов — kpk.css (общие с 3D) */
#top{display:flex;flex:1;overflow:hidden}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#canvas-wrap{flex:1;position:relative;background:var(--ground)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
canvas.drag{cursor:grabbing}
#sidebar{width:304px;display:flex;flex-direction:column;border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto}
#layers label{display:flex;align-items:center;gap:7px;padding:1px 0;color:var(--ink-2)}
#layers label:hover{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px}
#eventlog{flex:1;min-height:120px;overflow-y:auto;padding:4px 12px 8px}
#creative .tools button{padding:3px 7px}
#creative label{display:flex;align-items:center;gap:4px;color:var(--ink-2)}
#sel-info{color:var(--rust);min-height:16px;margin:8px 0 4px}
#hint{color:var(--ink-3);font-size:12px;margin-top:6px;line-height:1.35}
#cmdlog{max-height:110px;overflow-y:auto;font:10.5px/1.4 var(--f-mono);margin-top:6px;border-top:1px solid var(--rule);padding-top:4px}
#cmdlog .ok{color:var(--geiger)} #cmdlog .fail{color:var(--alarm)} #cmdlog .wait{color:var(--ink-3)}
#live-btn.on{border-color:var(--alarm);color:#f08a78;background:#33150f}
#statusbar{padding:3px 12px;font:11px var(--f-mono);color:var(--ink-3);border-top:1px solid var(--rule);
  background:var(--ground);white-space:nowrap;overflow:hidden;display:flex;gap:24px}
#hover{color:var(--ink-2)}
#panes{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:2}
#panes button{padding:1px 8px;background:rgba(18,17,13,.85);font-size:14px}
#roster{width:276px;background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;padding-bottom:8px}
#roster.hidden,#sidebar.hidden{display:none}
</style>
</head>
<body>
<div id="top">
  <div id="roster" class="roster"></div>
  <div id="center">
    <div id="canvas-wrap"><canvas id="cv"></canvas>
      <div id="panes">
        <button onclick="toggleRoster()" title="состав отрядов слева">◧</button>
        <button onclick="toggleField()" title="только поле боя (клавиша F)">⛶</button>
        <button onclick="toggleSidebar()" title="панель справа">◨</button>
      </div>
    </div>
    <div id="transport" class="transport">
      <button id="live-btn" class="on" onclick="goLive()" title="показывать то, что идёт в игре сейчас">● В эфире</button>
      <button id="follow-btn" class="on" onclick="toggleFollow()" title="новый матч — карта сама переезжает к его точке">⌖ за матчем</button>
      <button id="play-btn" onclick="togglePlay()" title="проиграть запись">▶</button>
      <select id="speed" title="скорость повтора"><option value="1">×1</option><option value="4" selected>×4</option><option value="16">×16</option></select>
      <input type="range" id="scrub" class="scrub" min="0" max="0" value="0" step="100" oninput="onScrub(+this.value)" title="перемотка">
      <div id="scrub-label" class="tlabel">—</div>
    </div>
  </div>
  <div id="sidebar">
    <div class="box">
      <b>Карта</b>
      <div class="row">
        <select id="level" onchange="pickLevel(this.value)" title="подложка: какой уровень показывать"><option value="auto">уровень: как в игре</option></select>
        <button onclick="fitFight()" title="приблизить к бою">к бою</button>
        <button onclick="fitLevel()" title="весь уровень">весь</button>
        <a href="quads.html" style="color:var(--rust)" title="площадки навмеша и песочница трассы">квадранты</a>
      </div>
      <div class="row">
        <select id="vmode" onchange="mapDirty=true; draw()" title="как красить слой «зрение»">
          <option value="mix">зрение: всё сразу</option>
          <option value="enc">замкнутость (стены рядом)</option>
          <option value="deep">глубина обзора</option>
          <option value="half">полукрытие (сел — спрятан)</option>
        </select>
      </div>
    </div>
    <div class="box" id="creative">
      <details open><summary>Творческий режим</summary>
      <div class="row tools" id="tools">
        <button data-tool="select" class="on" title="клик по бойцу — выбрать отряд, Shift — одного бойца">выбор</button>
        <button data-tool="spawn"  title="клик по карте — заспавнить отряд">спавн</button>
        <button data-tool="move"   title="клик — выбранные идут туда и стоят (ПКМ — то же из любого инструмента)">идти</button>
        <button data-tool="hold"   title="клик — стоять в точке">стоять</button>
        <button data-tool="attack" title="клик по бойцу — назначить его врагом выбранным">атака</button>
        <button data-tool="hostile" title="клик по бойцу другого отряда — стравить два отряда">стравить</button>
        <button data-tool="tp"     title="клик — перенести себя (актёра) туда">телепорт</button>
      </div>
      <div class="row">
        <select id="sp-faction" title="группировка нового отряда"></select>
        <select id="sp-level" title="уровень отряда"><option value="novice">новички</option><option value="advanced" selected>опытные</option><option value="veteran">ветераны</option></select>
        <label title="сколько бойцов">× <input type="number" id="sp-n" value="4" min="1" max="12"></label>
      </div>
      <div class="row">
        <label title="отряд нейтрален к тебе: смотришь, а не воюешь"><input type="checkbox" id="sp-ghost" checked> нейтральны ко мне</label>
        <label title="приказ перебивает бой и опасность; без галочки — бой важнее приказа"><input type="checkbox" id="ord-hard"> сквозь бой</label>
      </div>
      <div id="sel-info">ничего не выбрано</div>
      <div class="row">
        <select id="sel-preset" title="пресет дирижёра для выбранного отряда">
          <option value="default">дирижёр: общий</option><option value="shturm">ШТУРМ</option>
          <option value="greh">ГРЕХ</option><option value="front">ФРОНТ</option><option value="bound">ПЕРЕКАТЫ</option><option value="off">выключен</option>
        </select>
        <button onclick="selCmd('preset')">задать</button>
        <button onclick="selCmd('free')" title="снять приказы — снова сами по себе">свобода</button>
        <button onclick="selCmd('kill')">убить</button>
        <button onclick="selCmd('remove')">убрать</button>
      </div>
      <div class="row">
        <button onclick="send('freeze',['1'])" title="заморозить мир (консоль: freeze_time on)">❄ пауза</button>
        <button onclick="send('freeze',['0'])">▶ дальше</button>
        <button onclick="send('time',['0.25'])" title="скорость игры">×¼</button>
        <button onclick="send('time',['1'])">×1</button>
        <button onclick="send('time',['3'])">×3</button>
      </div>
      <div class="row" title="перенести себя на другой уровень (как быстрое перемещение); игра перезагрузит уровень">
        <select id="go-level"></select>
        <button onclick="send('level',[document.getElementById('go-level').value])">переехать</button>
      </div>
      <div class="row" title="сфера лучей вокруг тебя в игре — сверка запечки зрения (в игре — Scroll Lock)">
        <button onclick="send('probe',['on'])" title="снимок каждые 1,5 с, пока идёшь">эхолот вкл</button>
        <button onclick="send('probe',['off'])">выкл</button>
        <button onclick="send('probe',['once'])" title="один снимок здесь и сейчас, даже если стоишь">1 снимок</button>
      </div>
      <div id="hint"></div>
      <div id="cmdlog"></div>
      </details>
    </div>
    <div class="box" id="layers">
      <b>Слои</b>
      <div class="row" style="margin-bottom:6px">
        <button onclick="preset('player')" title="только то, что видно глазами">игрок</button>
        <button onclick="preset('analyst')" title="все слои">аналитик</button>
      </div>
    </div>
    <div class="box" style="border-bottom:none;padding-bottom:0"><b>Журнал</b></div>
    <div id="eventlog" class="log"></div>
  </div>
</div>
<div id="statusbar"><span id="status">жду данные из игры…</span><span id="hover"></span></div>

<script src="kpk.js"></script>
<script>
// ─────────────────────────────────────────────
// СЛОИ
// ─────────────────────────────────────────────
// [ключ, подпись, цвет образца, в наборе «игрок»]
const LAYERS = [
  ['relief', 'навмеш (рельеф)',    '#555',    true ],
  ['cover',  'укрытия',            '#b07a3a', false],
  ['vision', 'зрение (запечка cform)','#e04040', false],
  ['pano',   'панорама под мышью (стоя ─, сидя ┄)','#7fffd4', false],
  ['trails', 'следы путей',        '#4a6a8a', false],
  ['npcs',   'бойцы (погон ранга, ★ командир)','#2196F3', true ],
  ['squads', 'отряды (нашивка, мораль)','#d68a35', true ],
  ['belief2','вера: облако, щели, роли','#c86bff', true ],
  ['gaze',   'взгляд',             '#888',    true ],
  ['director','дирижёр (роли, фланг, мораль)','#00e5ff', true ],
  ['targets','цели (— видит, ┄ нет; белая — цель ранена)','#e05050', false],
  ['status', 'ранен / опасность / добивает','#ff5', false],
  ['shots',  'выстрелы / попадания','#FF7043', true ],
  ['barks',  'выкрики',            '#ddd',    true ],
  ['belief', 'вера v1 (конус)',    '#FFD700', false],
  ['echo',   'эхо',                '#b4a0ff', false],
  ['fan',    'веер поиска',        '#78c8c8', false],
  ['lots',   'лоты',               '#CE93D8', false],
  ['holds',  'посты HOLD',         '#fff',    false],
];
const on = {};
let layerSave = null;
try{ layerSave = JSON.parse(localStorage.getItem('varka_layers')); }catch(_){}
{
  const box = document.getElementById('layers');
  for(const [k,label,col,player] of LAYERS){
    on[k] = layerSave && k in layerSave ? layerSave[k] : true;
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" id="ly-${k}" ${on[k]?'checked':''}>`+
                  `<span class="sw" style="background:${col}"></span>${label}`;
    l.querySelector('input').onchange = e=>setLayer(k, e.target.checked);
    box.appendChild(l);
  }
}
function setLayer(k, v){
  on[k] = v;
  document.getElementById('ly-'+k).checked = v;
  try{ localStorage.setItem('varka_layers', JSON.stringify(on)); }catch(_){}
  if(k==='relief'||k==='cover'||k==='vision') mapDirty = true;
  if(k==='pano' && v) loadPano();
  draw();
}
function preset(name){
  for(const [k,,,player] of LAYERS) setLayer(k, name==='analyst' ? true : player);
}

// ─────────────────────────────────────────────
// ДАННЫЕ БОЯ
// ─────────────────────────────────────────────
const allEvents = [];
let t0 = 0, tMax = 0;   // время первого и последнего события, мс
let playT = 0;          // время, которое показываем
let isLive = true, isPlaying = false;

// группировки, нашивки, ранги, погоны, названия действий — kpk.js (общие с 3D)
onPatchLoad(() => { draw(); renderRoster(true); });
const strapPath = new Path2D(STRAP_SHAPE);
function drawStrap(cx, cy, i, h){   // погон на карте, центр в (cx, cy)
  const k = h/16, legend = i===7;
  ctx.save(); ctx.translate(cx - 5*k, cy - 8*k); ctx.scale(k, k);
  ctx.fillStyle = legend ? STRAP_GOLD : STRAP_BODY; ctx.fill(strapPath);
  ctx.strokeStyle = STRAP_EDGE; ctx.lineWidth = 0.9; ctx.stroke(strapPath);
  for(const [x,y,w,hh,c] of STRAP_PARTS[i]){ ctx.fillStyle = STRAP_COL[c]; ctx.fillRect(x,y,w,hh); }
  ctx.restore();
}
function drawStar(cx, cy, R){       // звезда командира отряда
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const r = i%2 ? R*0.45 : R, a = -Math.PI/2 + i*Math.PI/5;
    i ? ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r) : ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fillStyle = '#d9b25a'; ctx.fill();
  ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 1; ctx.stroke();
}
const FL = '"PT Sans Narrow","Arial Narrow",sans-serif';
function fnt(px, bold){ return (bold ? 'bold ' : '') + px + 'px ' + FL; }

// Состояние мира на момент playT. Строится проигрыванием событий по порядку;
// при движении вперёд докатываем, при перемотке назад — заново с нуля.
function freshState(){
  return { upto:0, npcs:{}, trails:{}, beliefs:{}, bel:{}, echos:{}, nodes:{}, lots:{}, holds:{},
           shots:[], barks:{}, evLog:[], plans:{}, roles:{}, moral:{}, flanks:{}, scouts:{}, posts:{}, rspots:{}, probe:null, probeN:0, holdouts:{}, match:null, plays:{}, intel:{} };
}
let S = freshState();

function applyEvent(s, ev){
  const t = ev.ev;

  if(t==='npc_pos'){
    s.npcs[ev.npc] = {px:ev.px,py:ev.py,pz:ev.pz,dx:ev.dx,dz:ev.dz,
                      rank:ev.rank,comm:ev.comm,active:ev.active,sq:ev.sq,_t:ev.t,
                      be:ev.be, bsee:ev.bsee, wnd:ev.wnd, dng:ev.dng, dtype:ev.dtype, kw:ev.kw,
                      aid:ev.aid, aid2:ev.aid2, hp:ev.hp, wpn:ev.wpn, wk:ev.wk, lead:ev.lead};
    (s.trails[ev.npc] ||= []).push(ev.px, ev.pz);

  } else if(t==='belief_born'||t==='belief_notice'||t==='belief_update'){
    const b = s.beliefs[ev.sq] || {cone:20,reach:3,mass:1};
    b.px=ev.px; b.pz=ev.pz; b.bx=ev.bx; b.bz=ev.bz; b._t=ev.t;
    s.beliefs[ev.sq] = b;

  } else if(t==='belief_snap'){
    const b = s.beliefs[ev.sq] || {};
    b.px=ev.px; b.pz=ev.pz; b.bx=ev.bx; b.bz=ev.bz;
    b.cone=ev.cone; b.reach=ev.reach; b.mass=ev.mass; b._t=ev.t;
    s.beliefs[ev.sq] = b;

  } else if(t==='bel'){
    s.bel[ev.sq] = ev;            // снимок веры v2 отряда (раз в секунду, пока облако живо)

  } else if(t==='belief_fade'||t==='belief_kill'){
    delete s.beliefs[ev.sq];

  } else if(t==='echo_born'||t==='echo_snap'){
    s.echos[ev.sq] = {px:ev.px,pz:ev.pz,_t:ev.t};

  } else if(t==='echo_dead'){
    delete s.echos[ev.sq];

  } else if(t==='lot_claim'){
    s.lots[ev.npc] = {vid:ev.vid,cx:ev.cx,cz:ev.cz,_t:ev.t};

  } else if(t==='lot_release'){
    delete s.lots[ev.npc];

  } else if(t==='search_node'){
    s.nodes[ev.vid] = {px:ev.nx,pz:ev.nz,w:ev.w||0,checked:false,_t:ev.t};

  } else if(t==='node_checked'){
    if(s.nodes[ev.vid]) s.nodes[ev.vid].checked = true;

  } else if(t==='hold_enter'){
    s.holds[ev.npc] = {px:ev.hx,pz:ev.hz,mode:ev.mode,_t:ev.t};

  } else if(t==='hold_expire'||t==='search_end'){
    delete s.holds[ev.npc];

  } else if(t==='alert_hear'){
    s.shots.push({px:ev.px,pz:ev.pz,stype:ev.stype,_t:ev.t});

  } else if(t==='bark'){
    s.barks[ev.npc] = {theme:ev.theme,_t:ev.t};

  } else if(t==='dir_plan'){
    // roles = "id:роль,id:роль" — роли отряда целиком заменяют прошлые
    const old = s.plans[ev.sq];
    if(old) for(const id of Object.keys(old.roles)) delete s.roles[id];
    const roles = {};
    for(const pair of (ev.roles||'').split(',')){
      const [id, role] = pair.split(':');
      if(id && role){ roles[id] = role; s.roles[id] = role; }
    }
    s.plans[ev.sq] = {preset:ev.preset, mode:ev.mode, roles, _t:ev.t};
    for(const id of Object.keys(s.flanks)) if(!(id in roles) || roles[id]!=='flank') delete s.flanks[id];

  } else if(t==='dir_moral'){
    // v0.5: мораль с осями (старые trace несут только moral)
    s.moral[ev.sq] = {v:ev.moral, target:ev.target, imp:ev.imp, st:ev.st, res:ev.res,
                      coh:ev.coh, inf:ev.inf, cap:ev.cap, fog:ev.fog, near:ev.near, wall:ev.wall, heavy:ev.heavy, wear:ev.wear};

  } else if(t==='holdout_start'){
    const slots = {};
    for(const part of String(ev.slots||'').split(';')){
      const [id,x,z] = part.split(':'); if(id) slots[id] = {px:+x, pz:+z};
    }
    s.holdouts[ev.sq] = {ax:ev.ax, az:ev.az, enc:ev.enc, slots, _t:ev.t};

  } else if(t==='match_start' || t==='match_clear'){
    // новый бой — метки прошлого (засели, перегруппировка, роли, флангеры) больше не про него
    for(const k of ['holdouts','posts','rspots','flanks','scouts','roles','plans','lots','holds','nodes','beliefs','echos','plays']) s[k] = {};
    if(t==='match_clear'){ s.match = null; return; }   // уборка перед следующим боем — прошлый матч кончился
    s.match = {id:ev.id, zx:ev.zx, zz:ev.zz, zr:ev.zr, limit:ev.limit, t0:ev.t,
               a:String(ev.a).split(',').map(Number), b:String(ev.b).split(',').map(Number), end:null};

  } else if(t==='match_end'){
    if(s.match && s.match.id===ev.id) s.match.end = ev;

  } else if(t==='intel'){
    // что отряд узнал о стволе врага (varka_intel): общее — видно всем, личное — только узнавшему
    (s.intel[ev.sq] ||= {})[ev.enemy] = {sec:ev.wpn_sec||ev.sec, cls:ev.cls, shared:ev.shared, by:ev.npc, _t:ev.t};

  } else if(t==='play_start'){
    s.plays[ev.sq] = {play:ev.play, slots:{}, _t:ev.t};

  } else if(t==='play_slots'){
    const pl = s.plays[ev.sq] ||= {play:ev.play, slots:{}};
    pl.slots = {};
    for(const part of String(ev.slots||'').split(';')){
      const [id,x,z,m] = part.split(':'); if(id) pl.slots[id] = {px:+x, pz:+z, mover:m==='1'};
    }

  } else if(t==='play_end'){
    delete s.plays[ev.sq];

  } else if(t==='holdout_end'){
    delete s.holdouts[ev.sq];

  } else if(t==='regroup_start'){
    s.posts[ev.sq] = {phase:'regroup', cap:ev.cap, till:ev.t+ev.dur, mstate:ev.mstate,
                      tx:ev.has_t ? ev.tx : null, tz:ev.tz};

  } else if(t==='all_clear'){
    if(s.posts[ev.sq]){ s.posts[ev.sq].phase='scout'; s.posts[ev.sq].scoutsTxt=ev.scouts; }

  } else if(t==='post_end'){
    delete s.posts[ev.sq];

  } else if(t==='probe'){
    // эхолот: храним только последний снимок (лучи с наклоном 0 — кольцо как у панорамы)
    s.probe = ev; s.probeN++;

  } else if(t==='regroup_spot'){
    s.rspots[ev.npc] = {px:ev.sx, pz:ev.sz, open:ev.open};

  } else if(t==='post_act_end'){
    delete s.rspots[ev.npc];

  } else if(t==='flank_pick'){
    s.flanks[ev.npc] = {px:ev.fx, pz:ev.fz, w:ev.w, arrived:false};

  } else if(t==='flank_arrive'){
    if(s.flanks[ev.npc]) s.flanks[ev.npc].arrived = true;

  } else if(t==='scout_go'){
    s.scouts[ev.npc] = {px:ev.sx, pz:ev.sz, _t:ev.t};
  }

  if(t!=='npc_pos' && t!=='bel' && t!=='belief_snap' && t!=='echo_snap' && t!=='dir_moral' && t!=='hit' && t!=='play_slots'){
    s.evLog.push(ev);
    if(s.evLog.length > 80) s.evLog.shift();
  }
}

function stateAt(T){
  if(S.upto > 0 && allEvents[S.upto-1] && allEvents[S.upto-1].t > T) S = freshState();
  while(S.upto < allEvents.length && allEvents[S.upto].t <= T){
    applyEvent(S, allEvents[S.upto]);
    S.upto++;
  }
  return S;
}

// рамка боя — для кнопки «к бою» и угадывания уровня
function fightBounds(){
  let b = null;
  const add=(x,z)=>{ if(x===undefined) return;
    if(!b) b={x0:x,x1:x,z0:z,z1:z};
    b.x0=Math.min(b.x0,x); b.x1=Math.max(b.x1,x); b.z0=Math.min(b.z0,z); b.z1=Math.max(b.z1,z); };
  for(const e of allEvents){ add(e.px,e.pz); add(e.cx,e.cz); add(e.nx,e.nz); add(e.hx,e.hz); }
  return b;
}

// ─────────────────────────────────────────────
// УРОВЕНЬ: подложка из запечённого level.ai
// ─────────────────────────────────────────────
let levels = {};        // имя → meta
let levelChoice = 'auto';
let L = null;           // текущий уровень: {meta, info: ImageData, vid: ImageData, vis?: ImageData, pano?: Uint16Array}
let hoverW = null;      // мир под мышью — для панорамы
let mapCv = null, mapDirty = true;

async function loadIndex(){
  try{
    const names = await (await fetch('levels/index.json')).json();
    const sel = document.getElementById('level');
    for(const n of names){
      levels[n] = await (await fetch(`levels/${n}.json`)).json();
      const o = document.createElement('option'); o.value=n; o.textContent=levelName(n); sel.appendChild(o);
      const g = document.createElement('option'); g.value=n; g.textContent=levelName(n);
      document.getElementById('go-level').appendChild(g);
    }
  }catch(e){ setStatus('нет levels/index.json — запеки уровень: bake_level.py'); }
}
// группировки для спавна: имя в команде spawn → как в игре
for(const [v,comm] of [['stalker','stalker'],['bandit','bandit'],['army','army'],['freedom','freedom'],['duty','dolg'],
    ['monolith','monolith'],['csky','csky'],['ecolog','ecolog'],['greh','greh'],['isg','isg'],['killer','killer'],['renegade','renegade']]){
  const o = document.createElement('option'); o.value = v; o.textContent = FACTION_RU[comm];
  document.getElementById('sp-faction').appendChild(o);
}

// Уровень угадываем по самому бою: все vid меньше числа нод и все точки внутри рамки.
// trace пока не пишет имя уровня — когда начнёт, это станет не нужно.
function guessLevel(){
  // игра пишет имя уровня в начале trace (varka_trace, событие level) — ему и верим
  for(let i=allEvents.length-1; i>=0; i--){
    const e = allEvents[i];
    if(e.ev==='level' && levels[e.name]) return e.name;
    // кусок матча (match/runs) начала trace не содержит, но раннер спрашивает уровень командой
    if(e.ev==='cmd_ok' && e.cmd==='level' && levels[e.info]) return e.info;
  }
  // старые записи без имени: самый маленький уровень, куда влезает бой
  let maxVid = -1;
  for(const e of allEvents) if(e.vid!==undefined && e.vid>maxVid) maxVid = e.vid;
  const b = fightBounds();
  let best = null;
  for(const [n,m] of Object.entries(levels)){
    if(maxVid >= m.count) continue;
    if(b && (b.x0 < m.box[0]-5 || b.x1 > m.box[3]+5 || b.z0 < m.box[2]-5 || b.z1 > m.box[5]+5)) continue;
    if(!best || m.count < levels[best].count) best = n;
  }
  return best;
}

async function pickLevel(choice){
  levelChoice = choice;
  const name = choice==='auto' ? guessLevel() : choice;
  if(L && L.meta.name===name) return;
  L = null; mapDirty = true;
  if(!name){ draw(); return; }
  const grab = async src=>{
    const img = new Image(); img.src = src; await img.decode();
    const c = document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const x = c.getContext('2d'); x.drawImage(img,0,0);
    return x.getImageData(0,0,img.width,img.height);
  };
  const [info, vid] = await Promise.all([grab(`levels/${name}.png`), grab(`levels/${name}_vid.png`)]);
  L = {meta:levels[name], info, vid};
  if(L.meta.vision){   // запечка зрения есть (vision/bake_vision.py)
    L.vis = await grab(`levels/${name}_vision.png`);
    if(on.pano) loadPano();
  }
  if(!view) fitFight();
  draw();
}

// Панорама — 50 МБ, грузим только когда слой включён
async function loadPano(){
  if(!L || !L.meta.vision || L.pano || L.panoLoading) return;
  L.panoLoading = true;
  setStatus('гружу панораму...');
  const buf = await (await fetch(`levels/${L.meta.name}_pano.bin`)).arrayBuffer();
  L.pano = new Uint16Array(buf);
  L.panoLoading = false;
  draw();
}

// Красим подложку под включённые слои: серый = высота, тёплый оттенок = укрытие.
// В level.ai хранится открытость (15 = голо, 0 = закрыто), движок берёт min(высокое, низкое) —
// cover_evaluators.cpp. Укрытие = 1 − min/15.
function buildMap(){
  const {w,h} = L.meta, src = L.info.data;
  mapCv = mapCv || document.createElement('canvas');
  mapCv.width = w; mapCv.height = h;
  const mx = mapCv.getContext('2d');
  const out = mx.createImageData(w,h), d = out.data;
  const vis = on.vision && L.vis ? L.vis.data : null, vmode = document.getElementById('vmode').value;
  for(let i=0;i<src.length;i+=4){
    if(!src[i+3] || (!on.relief && !on.cover && !vis)) continue;
    if(vis){
      // R = замкнутость, G = глубина обзора (лог), B = полукрытие — см. bake_vision.py
      const e = vis[i], dp = vis[i+1], hf = vis[i+2];
      let r, g, b;
      if(vmode==='enc'){ r = 30+e*0.9; g = 30+e*0.25; b = 30; }
      else if(vmode==='deep'){ r = 20+dp*0.3; g = 20+dp*0.75; b = 30+dp*0.5; }
      else if(vmode==='half'){ const h = Math.min(255, hf*4); r = 30; g = 40+h*0.4; b = 40+h*0.85; }
      else { r = e; g = dp*0.8; b = Math.min(255, hf*4); }
      if(on.relief){ const k = 0.75 + src[i]/255*0.4; r*=k; g*=k; b*=k; }
      d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
      continue;
    }
    let g = on.relief ? 34 + src[i]*0.42 : 46;
    let r = g, b = g;
    if(on.cover){
      // типичная нода в поле открыта на 6–8 из 15; настоящее укрытие — 4 и ниже (~9% нод)
      const c = Math.max(0, (5.5 - Math.min(src[i+1], src[i+2])/17) / 5.5);
      r += 170*c; g += 60*c; b -= 30*c;
    }
    d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
  }
  mx.putImageData(out,0,0);
  mapDirty = false;
}

// ─────────────────────────────────────────────
// ВИД: мир (x, z) → экран. Север (+z) вверх, метры × масштаб.
// ─────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let view = null;  // {cx, cz, sc}: центр экрана в мире и пикселей на метр

function resize(){ cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; draw(); }
window.addEventListener('resize', resize);

function w2s(x, z){ return {x: cv.width/2 + (x-view.cx)*view.sc, y: cv.height/2 - (z-view.cz)*view.sc}; }
function s2w(px, py){ return {x: view.cx + (px-cv.width/2)/view.sc, z: view.cz - (py-cv.height/2)/view.sc}; }

function fitBox(x0,x1,z0,z1){
  const pad = Math.max(x1-x0, z1-z0)*0.15 + 10;
  view = {cx:(x0+x1)/2, cz:(z0+z1)/2,
          sc: Math.min(cv.width/(x1-x0+2*pad), cv.height/(z1-z0+2*pad))};
  draw();
}
function fitFight(){
  const b = fightBounds();
  if(b) fitBox(b.x0,b.x1,b.z0,b.z1); else fitLevel();
}
function fitLevel(){
  if(L){ const m=L.meta.box; fitBox(m[0],m[3],m[2],m[5]); }
}

// Мышь: колесо — зум к курсору, перетаскивание — сдвиг, наведение — нода под курсором
let drag = null;
cv.addEventListener('wheel', e=>{
  if(!view) return;
  e.preventDefault();
  const before = s2w(e.offsetX, e.offsetY);
  view.sc *= Math.exp(-e.deltaY*0.0015);
  const after = s2w(e.offsetX, e.offsetY);
  view.cx += before.x-after.x; view.cz += before.z-after.z;
  draw();
}, {passive:false});
let downAt = null;   // где нажали: если отпустили почти там же — это клик, а не перетаскивание
cv.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  drag = {x:e.offsetX, y:e.offsetY}; downAt = {x:e.offsetX, y:e.offsetY}; cv.classList.add('drag');
});
window.addEventListener('mouseup', e=>{
  if(downAt && e.target===cv && Math.hypot(e.offsetX-downAt.x, e.offsetY-downAt.y) < 4) mapClick(e, false);
  drag = null; downAt = null; cv.classList.remove('drag');
});
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); mapClick(e, true); });
cv.addEventListener('mousemove', e=>{
  if(drag && view){
    view.cx -= (e.offsetX-drag.x)/view.sc; view.cz += (e.offsetY-drag.y)/view.sc;
    drag = {x:e.offsetX, y:e.offsetY};
    draw();
  }
  showHover(e.offsetX, e.offsetY);
  if(on.pano && L && L.pano){ hoverW = view ? s2w(e.offsetX, e.offsetY) : null; draw(); }
});

function nodeAt(x, z){
  if(!L) return null;
  const m = L.meta;
  const i = Math.round((x-m.box[0])/m.cell);
  const j = m.h-1 - Math.round((z-m.box[2])/m.cell);
  if(i<0||j<0||i>=m.w||j>=m.h) return null;
  const k = (j*m.w+i)*4, v = L.vid.data, f = L.info.data;
  const vid = (v[k]<<16 | v[k+1]<<8 | v[k+2]) - 1;
  if(vid < 0) return null;
  const out = {vid, y: m.box[1] + f[k]/255*(m.box[4]-m.box[1]),
          high: Math.round(f[k+1]/17), low: Math.round(f[k+2]/17),
          x: m.box[0] + i*m.cell, z: m.box[2] + (m.h-1-j)*m.cell};
  if(L.vis){ const q = L.vis.data; out.enc = q[k]/255; out.deep = Math.expm1(q[k+1]/255*Math.log1p(m.vision.range)); out.half = q[k+2]/255; }
  return out;
}

function showHover(px, py){
  const el = document.getElementById('hover');
  if(!view){ el.textContent=''; return; }
  const p = s2w(px, py), n = nodeAt(p.x, p.z);
  el.textContent = `x=${p.x.toFixed(1)} z=${p.z.toFixed(1)}  ` +
    (n ? `vid ${n.vid}  y=${n.y.toFixed(1)}  открыто: выс ${n.high}/15 низ ${n.low}/15 (0 = закрыто)` +
         (n.enc!=null ? `  ·  стены ${Math.round(n.enc*100)}%  обзор ${n.deep.toFixed(0)} м  полукрытие ${Math.round(n.half*100)}%` : '')
       : 'нет ноды (стена / край)');
}

// ─────────────────────────────────────────────
// РИСОВАНИЕ
// ─────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#12110d';
  ctx.fillRect(0,0,cv.width,cv.height);
  if(!view){
    ctx.fillStyle='#6f6956'; ctx.font=fnt(16);
    ctx.fillText('Жду события из игры: загрузи сейв с VARKA и начни бой или матч.', 24, 44);
    return;
  }

  // подложка: клетка 0,7 м = пиксель картинки, растягиваем без сглаживания
  if(L && (on.relief || on.cover || on.vision)){
    if(mapDirty) buildMap();
    const m = L.meta, tl = w2s(m.box[0]-m.cell/2, m.box[5]+m.cell/2);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mapCv, tl.x, tl.y, m.w*m.cell*view.sc, m.h*m.cell*view.sc);
  }

  const s = stateAt(playT);
  const sc = view.sc;
  const alive = npc => playT - npc._t <= 3000;  // нет npc_pos > 3 с — мёртв или ушёл из онлайна

  // ── следы путей ───────────────────────────────
  if(on.trails){
    ctx.lineWidth = 1;
    for(const [id,tr] of Object.entries(s.trails)){
      const npc = s.npcs[id];
      ctx.strokeStyle = fcolor(npc && npc.comm) + (npc && alive(npc) ? '88' : '33');
      ctx.beginPath();
      for(let i=0;i<tr.length;i+=2){
        const p = w2s(tr[i], tr[i+1]);
        i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y);
      }
      ctx.stroke();
    }
  }

  // ── вера v2: облако «где он может быть», щели, роли (varka_belief) ──
  if(on.belief2) drawBelief(s, alive);

  // ── веер поиска ───────────────────────────────
  if(on.fan){
    for(const n of Object.values(s.nodes)){
      const p = w2s(n.px, n.pz);
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      if(n.checked) ctx.fillStyle='#333';
      else{
        const w = Math.max(0,Math.min(1,n.w));
        ctx.fillStyle=`rgb(${40+215*w|0},${120+80*w|0},${200-200*w|0})`;
      }
      ctx.fill();
    }
  }

  // ── эхо ───────────────────────────────────────
  // вера и эхо выбитых/убранных отрядов в игре доживают по возрасту — рисовать незачем
  const liveSq = new Set(Object.values(s.npcs).filter(alive).map(n=>String(n.sq)));
  if(on.echo){
    for(const [sq,e] of Object.entries(s.echos)){
      if(!liveSq.has(String(sq))) continue;
      const p = w2s(e.px, e.pz);
      ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2);
      ctx.strokeStyle='rgba(180,160,255,0.35)'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='rgba(180,160,255,0.6)'; ctx.font=fnt(10);
      ctx.fillText('эхо sq'+sq, p.x+12, p.y-10);
    }
  }

  // ── вера: конус «куда враг делся» ─────────────
  if(on.belief){
    for(const [sq,b] of Object.entries(s.beliefs)){
      if(!liveSq.has(String(sq))) continue;
      const p = w2s(b.px, b.pz);
      const mass = Math.max(0, Math.min(1, b.mass||0));
      const half = ((b.cone||45)/2) * Math.PI/180;
      const ang  = Math.atan2(-(b.bz||0), b.bx||1);   // минус: на экране z вверх
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, Math.max(6,(b.reach||10)*sc), ang-half, ang+half);
      ctx.closePath();
      ctx.fillStyle   = `rgba(255,200,0,${0.08+mass*0.35})`; ctx.fill();
      ctx.strokeStyle = `rgba(255,200,0,${0.25+mass*0.6})`; ctx.lineWidth=1; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fillStyle='#FFD700'; ctx.fill();
      ctx.fillStyle='rgba(255,200,0,0.9)'; ctx.font=fnt(11,1);
      ctx.fillText(`sq${sq} m=${mass.toFixed(2)} ${(b.cone||0).toFixed(0)}°`, p.x+8, p.y-6);
    }
  }

  // ── выстрелы и попадания: вспышка 2 с ─────────
  if(on.shots){
    for(const sh of s.shots){
      const age = playT - sh._t;
      if(age < 0 || age > 2000 || sh.px===undefined) continue;
      const p = w2s(sh.px, sh.pz), k = 1 - age/2000;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 14*(1-k), 0, Math.PI*2);
      ctx.strokeStyle=`rgba(255,112,67,${k})`; ctx.lineWidth=2; ctx.stroke();
    }
  }

  // ── лоты: кто какую ноду занял ────────────────
  if(on.lots){
    ctx.setLineDash([3,4]);
    for(const [id,lot] of Object.entries(s.lots)){
      const npc = s.npcs[id];
      if(!npc || !alive(npc)) continue;
      const a = w2s(npc.px, npc.pz), c = w2s(lot.cx, lot.cz), col = fcolor(npc.comm);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y);
      ctx.strokeStyle=col+'aa'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath();
      ctx.moveTo(c.x,c.y-4); ctx.lineTo(c.x+4,c.y); ctx.lineTo(c.x,c.y+4); ctx.lineTo(c.x-4,c.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.setLineDash([]);
  }

  // ── посты HOLD ────────────────────────────────
  if(on.holds){
    for(const h of Object.values(s.holds)){
      const p = w2s(h.px, h.pz);
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(p.x-5, p.y-5, 10, 10);
      ctx.fillStyle='#ccc'; ctx.font=fnt(10); ctx.fillText('HOLD '+(h.mode||''), p.x+7, p.y+3);
    }
  }

  // ── цели: линия к best_enemy. Сплошная — видит сейчас, пунктир — цель по памяти ──
  if(on.targets){
    for(const npc of Object.values(s.npcs)){
      if(!alive(npc) || npc.be===undefined || npc.be<0) continue;
      const t = s.npcs[npc.be];
      if(!t || !alive(t)) continue;   // актёр и не трассируемые цели не рисуются
      const a = w2s(npc.px,npc.pz), b = w2s(t.px,t.pz);
      ctx.setLineDash(npc.bsee ? [] : [4,4]);
      ctx.strokeStyle = t.wnd ? 'rgba(255,255,255,0.9)' : fcolor(npc.comm)+'aa';  // цель-раненый — белым (Долг и так красный)
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      const ang = Math.atan2(b.y-a.y, b.x-a.x);   // стрелка у цели
      ctx.setLineDash([]); ctx.beginPath();
      ctx.moveTo(b.x-Math.cos(ang)*8, b.y-Math.sin(ang)*8);
      ctx.lineTo(b.x-Math.cos(ang-0.4)*16, b.y-Math.sin(ang-0.4)*16);
      ctx.moveTo(b.x-Math.cos(ang)*8, b.y-Math.sin(ang)*8);
      ctx.lineTo(b.x-Math.cos(ang+0.4)*16, b.y-Math.sin(ang+0.4)*16);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  const groups = squadGroups(s, alive);

  // ── дирижёр: точка фланга, путь скаута, пьесы, убежища ──
  if(on.director){
    for(const [id,f] of Object.entries(s.flanks)){
      const npc = s.npcs[id]; if(!npc || !alive(npc)) continue;
      const a = w2s(npc.px,npc.pz), c = w2s(f.px,f.pz);
      ctx.setLineDash([6,4]); ctx.strokeStyle='#00e5ff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(c.x,c.y-7); ctx.lineTo(c.x+7,c.y); ctx.lineTo(c.x,c.y+7); ctx.lineTo(c.x-7,c.y); ctx.closePath();
      ctx.strokeStyle='#00e5ff'; ctx.lineWidth=2; ctx.stroke();
      if(f.arrived){ ctx.fillStyle='#00e5ff'; ctx.fill(); }
    }
    for(const [id,sc] of Object.entries(s.scouts)){
      const npc = s.npcs[id]; if(!npc || !alive(npc) || s.roles[id]!=='scout') continue;
      const a = w2s(npc.px,npc.pz), c = w2s(sc.px,sc.pz);
      ctx.setLineDash([2,4]); ctx.strokeStyle='#b4a0ff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]);
    }
    // пьесы контакта: огневые точки, линии от бойцов (перебегающие — сплошной, держащие — пунктир)
    for(const [sq,pl] of Object.entries(s.plays)){
      if(!groups[sq]) continue;
      const col = PLAY_COL[pl.play] || '#fff';
      const pts = [];
      for(const [id,sl] of Object.entries(pl.slots)){
        const c = w2s(sl.px, sl.pz), npc = s.npcs[id];
        pts.push([sl, c]);
        ctx.strokeStyle=col; ctx.lineWidth=2; ctx.strokeRect(c.x-4,c.y-4,8,8);
        if(npc && alive(npc)){
          const q = w2s(npc.px,npc.pz);
          ctx.setLineDash(sl.mover ? [] : [3,3]); ctx.strokeStyle=col; ctx.lineWidth=1.2;
          ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]);
        }
      }
      if(pl.play==='front' && pts.length > 1){   // ФРОНТ — соединить точки линией
        ctx.strokeStyle=col+'88'; ctx.lineWidth=1; ctx.beginPath();
        pts.forEach(([,c],i)=> i ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y)); ctx.stroke();
      }
    }
    // засесть: убежище (домик) и места бойцов
    for(const [sq,ho] of Object.entries(s.holdouts)){
      if(!groups[sq]) continue;   // отряд выбит — убежище больше не рисуем
      const a = w2s(ho.ax, ho.az);
      ctx.strokeStyle='#ff7043'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(a.x-8,a.y+7); ctx.lineTo(a.x-8,a.y-2); ctx.lineTo(a.x,a.y-9); ctx.lineTo(a.x+8,a.y-2); ctx.lineTo(a.x+8,a.y+7); ctx.closePath(); ctx.stroke();
      for(const [id,sl] of Object.entries(ho.slots)){
        const c = w2s(sl.px, sl.pz), npc = s.npcs[id];
        ctx.fillStyle='#ff7043'; ctx.fillRect(c.x-2,c.y-2,4,4);
        if(npc && alive(npc)){
          const q = w2s(npc.px,npc.pz);
          ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(255,112,67,0.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]);
        }
      }
    }
    // после боя: точка угрозы и укрытия перегруппировки
    for(const [sq,po] of Object.entries(s.posts)){
      if(po.tx==null) continue;
      const c = w2s(po.tx, po.tz);
      ctx.strokeStyle='#ff5252'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(c.x-7,c.y-7); ctx.lineTo(c.x+7,c.y+7); ctx.moveTo(c.x+7,c.y-7); ctx.lineTo(c.x-7,c.y+7); ctx.stroke();
      ctx.fillStyle='#ff8a80'; ctx.font=fnt(11,1);
      ctx.fillText(`угроза sq${sq}`, c.x+9, c.y-6);
    }
    for(const [id,sp] of Object.entries(s.rspots)){
      const npc = s.npcs[id]; if(!npc || !alive(npc)) continue;
      const a = w2s(npc.px,npc.pz), c = w2s(sp.px,sp.pz);
      ctx.setLineDash([3,3]); ctx.strokeStyle='#a5d6a7'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#a5d6a7'; ctx.fillRect(c.x-3,c.y-3,6,6);
    }
  }

  drawCreative(s, alive);
  drawPano();
  drawProbe(s);
  drawMatch(s);

  // ── бойцы и взгляд ────────────────────────────
  for(const [id,npc] of Object.entries(s.npcs)){
    if(!alive(npc)) continue;
    const p = w2s(npc.px, npc.pz), col = fcolor(npc.comm), r = npc.active ? 7 : 5;
    if(on.gaze){
      const ang = Math.atan2(-(npc.dz||0), npc.dx||1);
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x+Math.cos(ang)*16, p.y+Math.sin(ang)*16);
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    }
    if(on.npcs){
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
      ctx.strokeStyle = npc.active ? '#fff' : '#222'; ctx.lineWidth = npc.active ? 2 : 1; ctx.stroke();
      const tag = String(id), sh = 15, sw = sh*10/16;
      ctx.font = fnt(12);
      const tw = ctx.measureText(tag).width, bx = p.x+r+3, by = p.y-r-10;
      ctx.fillStyle = 'rgba(11,10,7,0.86)'; ctx.fillRect(bx, by, sw+tw+9, sh+3);
      ctx.strokeStyle = '#463f30'; ctx.lineWidth = 1; ctx.strokeRect(bx+.5, by+.5, sw+tw+8, sh+2);
      drawStrap(bx+2+sw/2, by+1.5+sh/2, rankIdx(npc.rank||0), sh);
      ctx.fillStyle = '#ddd5bf'; ctx.fillText(tag, bx+sw+5, by+sh-2);
      if(npc.lead) drawStar(p.x, p.y-r-8, 5.5);
      if(npc.hp!=null){
        const hp = Math.max(0, Math.min(1, npc.hp));
        ctx.fillStyle='#222'; ctx.fillRect(p.x-8, p.y+r+3, 16, 3);
        ctx.fillStyle=hpColor(hp); ctx.fillRect(p.x-8, p.y+r+3, 16*hp, 3);
      }
    }
    if(on.status){
      if(npc.wnd){   // ранен: белый крест на бойце
        ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
        ctx.moveTo(p.x-r-3,p.y-r-3); ctx.lineTo(p.x+r+3,p.y+r+3);
        ctx.moveTo(p.x+r+3,p.y-r-3); ctx.lineTo(p.x-r-3,p.y+r+3); ctx.stroke();
      }
      const tags = [];
      if(npc.dng) tags.push('! '+(npc.dtype||'danger'));
      if(npc.kw)  tags.push('добивает');
      if(tags.length){
        ctx.fillStyle = npc.kw ? '#ff8a80' : '#ffee58'; ctx.font=fnt(11,1);
        ctx.fillText(tags.join(' · '), p.x+r+2, p.y-r-11);
      }
    }
    const role = s.roles[id];
    if(on.director && role && role!=='hold'){   // hold — норма, подписываем только особые роли
      const po = s.posts[npc.sq];
      const cap = po && String(po.cap)===String(id) ? 'КЭП · ' : '';
      ctx.fillStyle = role==='flank' ? '#00e5ff' : role==='regroup' || role==='guard' ? '#a5d6a7' : '#b4a0ff';
      ctx.font=fnt(11,1);
      ctx.fillText(cap + (ROLE_NAMES[role] || role.toUpperCase()), p.x-r-2, p.y+r+22);
    }
    const bk = s.barks[id];
    if(on.barks && bk && playT-bk._t < 2500){
      ctx.fillStyle='#fff'; ctx.font=fnt(12,1);
      ctx.fillText('«'+bk.theme+'»', p.x+r+2, p.y+r+11);
    }
  }

  // ── отряды: плашка над верхним бойцом — нашивка группировки, номер, режим дирижёра, мораль ──
  // клик по плашке — выделить отряд; подробности — в составе слева
  badgeHits = [];
  if(on.squads){
    for(const [sq,g] of Object.entries(groups)){
      const pl = s.plans[sq], m = s.moral[sq], po = s.posts[sq];
      const p = w2s(g.x/g.n, g.zmax);
      const P = 24, w = 80, h = 28, x0 = p.x - w/2, y0 = p.y - 26 - h, tx = x0 + P + 6;
      const isSel = sel && sel.kind==='sq' && sel.id===+sq;
      // от плашки к бойцам: еле видно всегда, ярко у выбранного
      ctx.strokeStyle = isSel ? 'rgba(214,138,53,0.55)' : 'rgba(221,213,191,0.12)'; ctx.lineWidth = 1;
      for(const n of g.members){ const q = w2s(n.px,n.pz); ctx.beginPath(); ctx.moveTo(p.x, y0+h); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(18,17,13,0.88)'; ctx.fillRect(x0, y0, w, h);
      ctx.fillStyle = fcolor(g.comm); ctx.fillRect(x0, y0+h-2, w, 2);
      const im = patchImg(g.comm);
      if(im) ctx.drawImage(im, x0+2, y0+1, P, P);
      else { ctx.fillStyle = fcolor(g.comm)+'55'; ctx.fillRect(x0+4, y0+3, P-4, P-6); }
      ctx.font = fnt(14,1); ctx.fillStyle = '#ddd5bf'; ctx.fillText(sqShort(sq), tx, y0+13);
      if(pl && MODE_GLYPH[pl.mode]){ ctx.font = fnt(13); ctx.fillStyle = '#00e5ff'; ctx.fillText(MODE_GLYPH[pl.mode], x0+w-13, y0+13); }
      const mv = m==null ? null : (typeof m==='object' ? m : {v:+m});
      if(mv){
        const bw = w - P - 12;
        ctx.fillStyle = '#2c2920'; ctx.fillRect(tx, y0+18, bw, 5);
        ctx.fillStyle = MSTATE_COL[mv.st] || '#00e5ff'; ctx.fillRect(tx, y0+18, bw*Math.max(0, Math.min(1, mv.v)), 5);
        const imp = mv.imp||0;
        if(Math.abs(imp) > 0.003){ ctx.font=fnt(12,1); ctx.fillStyle = imp<0 ? '#ff5252' : '#69f0ae'; ctx.fillText(imp<0?'▾':'▴', x0+w+3, y0+24); }
      } else {
        ctx.font = fnt(11); ctx.fillStyle = '#a8a08a'; ctx.fillText(`в строю ${g.n}`, tx, y0+23);
      }
      if(po && po.phase==='regroup'){
        ctx.font=fnt(11); ctx.fillStyle='#a5d6a7';
        ctx.fillText(`⏱${Math.max(0,(po.till-playT)/1000).toFixed(0)}`, x0+w+3, y0+12);
      }
      ctx.strokeStyle = isSel ? '#d68a35' : '#463f30'; ctx.lineWidth = isSel ? 2 : 1; ctx.strokeRect(x0+.5, y0+.5, w-1, h-1);
      badgeHits.push({sq:+sq, x0, y0, x1:x0+w, y1:y0+h});
    }
  }
}

// Панорама ноды под мышью: лучи до упора, стоя — сплошной контур, сидя — пунктир.
// Это та самая «эхолокация»: что видно с этой точки, без хождения — из геометрии уровня.
// Вера v2 (varka_belief, событие bel раз в секунду). Клетки — фиолетом, гуще = вероятнее (масса в
// стотысячных, шкала логарифмическая от порога 5). Щель — ромб: край тени, через который она затечёт
// в вычищенное. Роли: сплошная — ЗАГЛЯНУТЬ, пунктир — ДЕРЖАТЬ КРАЙ. Есть засада у угла — линия ведёт к
// ней (квадратик), оттуда точками — прицел в щель; нет — к щели, оттуда точками — в гущу тени.
function belParse(b){
  if(b._cells) return;
  const rows = (str, f) => (str || '').split(';').filter(Boolean).map(t => f(t.split(',')));
  b._cells = rows(b.c, ([ix, iz, y, m]) => ({ix:+ix, iz:+iz, y:y/10, m:+m}));
  b._gaps  = rows(b.g, ([x, z, w]) => ({x:+x, z:+z, w:+w}));
  b._roles = rows(b.a, ([id, kind, x, z, lx, lz, ax, az]) =>
    ({id:+id, kind, x:+x, z:+z, lx:+lx, lz:+lz, ax: ax === undefined ? null : +ax, az: az === undefined ? null : +az}));
}
function drawBelief(s, alive){
  const sc = view.sc;
  for(const b of Object.values(s.bel)){
    if(playT - b.t > 1600) continue;          // облака нет — снимки не приходят
    belParse(b);
    const cs = b.cs || 3, w = Math.max(1, cs*sc - 0.5);
    let top = 5, heavy = null;
    for(const c of b._cells) if(c.m > top){ top = c.m; heavy = c; }
    const lt = Math.log(top / 5);
    for(const c of b._cells){
      const k = lt > 0 ? Math.max(0, Math.log(c.m / 5)) / lt : 1;
      const p = w2s(c.ix*cs, (c.iz+1)*cs);
      ctx.fillStyle = `rgba(200,107,255,${(0.10 + 0.55*k).toFixed(3)})`;
      ctx.fillRect(p.x, p.y, w, w);
    }
    for(const g of b._gaps){
      if(g.w < 10) continue;                  // тень легче 1% — крошка
      const p = w2s(g.x, g.z);
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x-6,p.y); ctx.lineTo(p.x,p.y-6); ctx.lineTo(p.x+6,p.y); ctx.lineTo(p.x,p.y+6);
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#f2c14e'; ctx.font = fnt(10);
      ctx.fillText(`щель · за ней ${Math.round(g.w / 10 / Math.max(b.u, 1e-6))}% веры`, p.x+9, p.y-5);
    }
    for(const r of b._roles){
      const npc = s.npcs[r.id];
      if(!npc || !alive(npc)) continue;
      const a = w2s(npc.px, npc.pz), gap = w2s(r.x, r.z);
      const go = r.ax !== null ? w2s(r.ax, r.az) : gap, aim = r.ax !== null ? gap : w2s(r.lx, r.lz);
      const col = r.kind === 'h' ? '#f2c14e' : '#e0b3ff';
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.setLineDash(r.kind === 'h' ? [5,4] : []);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(go.x,go.y); ctx.stroke();
      ctx.setLineDash([2,3]); ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(go.x,go.y); ctx.lineTo(aim.x,aim.y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.setLineDash([]);
      if(r.ax !== null){ ctx.fillStyle = col; ctx.fillRect(go.x-3, go.y-3, 6, 6); }
      ctx.fillStyle = col; ctx.font = fnt(10,1);
      ctx.fillText(r.kind === 'h' ? 'держит край' : 'заглядывает', a.x+9, a.y+15);
    }
    if(heavy){
      const p = w2s((heavy.ix+1)*cs, (heavy.iz+1)*cs);
      ctx.fillStyle = '#e0b3ff'; ctx.font = fnt(11,1);
      // масса облака: 1 на врага; при нескольких врагах — среднее на одного
      const k = b.clouds || 1, pc = v => Math.round(v / k * 100);
      const n = k > 1 ? ` · врагов ${k}` : '';
      ctx.fillText(`в тени ${pc(b.u)}% · вычеркнули ${pc(b.eaten)}% · ушёл ${pc(b.lost)}%${n}`, p.x+4, p.y-4);
    }
  }
}

function drawPano(){
  if(!on.pano || !L || !L.pano || !hoverW) return;
  const n = nodeAt(hoverW.x, hoverW.z);
  if(!n) return;
  const v = L.meta.vision, nd = v.ndirs, base = L.meta.count*nd;
  const c = w2s(n.x, n.z);
  const ring = (off, stroke, fill, dash)=>{
    ctx.beginPath();
    for(let i=0;i<=nd;i++){
      const k = i % nd, raw = L.pano[off + n.vid*nd + k];
      const d = raw===65535 ? v.range : raw/100, a = 2*Math.PI*k/nd;
      const p = w2s(n.x + Math.cos(a)*d, n.z + Math.sin(a)*d);
      i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y);
    }
    ctx.setLineDash(dash);
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]);
  };
  ring(0, '#7fffd4', 'rgba(127,255,212,0.10)', []);
  ring(base, '#ffb74d', null, [4,4]);
  ctx.fillStyle='#7fffd4'; ctx.beginPath(); ctx.arc(c.x,c.y,3,0,Math.PI*2); ctx.fill();
}

// Матч: точка-задача (держит тот, у кого в радиусе только свои) и табло у нижнего края карты
// (юзер 21.10: над точкой мешало смотреть бой):
// [нашивка] Сторона A #id  против  #id Сторона B [нашивка], ниже — время или итог
function commOf(s, sqs){ for(const n of Object.values(s.npcs)) if(sqs.includes(n.sq)) return n.comm; return null; }
function drawMatch(s){
  const m = s.match;
  if(!m || (m.end && playT - m.end.t > 20000)) return;
  const c = w2s(m.zx, m.zz), r = m.zr * view.sc;
  ctx.setLineDash([8,6]); ctx.strokeStyle='rgba(221,213,191,0.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  const ca = commOf(s, m.a), cb = commOf(s, m.b);
  const left = `${FACTION_RU[ca] || 'A'} ${m.a.map(sqShort).join(' ')}`, vs = '  против  ',
        right = `${m.b.map(sqShort).join(' ')} ${FACTION_RU[cb] || 'B'}`;
  const el = ((m.end ? m.end.t : playT) - m.t0) / 1000;
  const tail = m.end ? `итог: ${END_RU[m.end.reason] || m.end.reason}, в живых ${m.end.alive_a} : ${m.end.alive_b}` : `${el.toFixed(0)} / ${m.limit} с`;
  const P = 24;
  ctx.font = fnt(14,1);
  const wl = ctx.measureText(left).width, wv = ctx.measureText(vs).width, wr = ctx.measureText(right).width;
  const W = P + 8 + wl + wv + wr + 8 + P + 12, H = 44, x0 = Math.round(cv.width/2 - W/2), y0 = cv.height - H - 10;
  ctx.fillStyle = 'rgba(18,17,13,0.9)'; ctx.fillRect(x0, y0, W, H);
  ctx.strokeStyle = '#463f30'; ctx.lineWidth = 1; ctx.strokeRect(x0+.5, y0+.5, W-1, H-1);
  const pa = ca && patchImg(ca), pb = cb && patchImg(cb);
  if(pa) ctx.drawImage(pa, x0+6, y0+4, P, P);
  if(pb) ctx.drawImage(pb, x0+W-6-P, y0+4, P, P);
  let x = x0 + 6 + P + 8;
  ctx.fillStyle = fcolor(ca); ctx.fillText(left, x, y0+21); x += wl;
  ctx.fillStyle = '#6f6956'; ctx.fillText(vs, x, y0+21); x += wv;
  ctx.fillStyle = fcolor(cb); ctx.fillText(right, x, y0+21);
  ctx.font = fnt(12); ctx.fillStyle = m.end ? '#d68a35' : '#a8a08a';
  const wt = ctx.measureText(tail).width;
  ctx.fillText(tail, cv.width/2 - wt/2, y0+38);
}

// Последний снимок эхолота: горизонтальные лучи (наклон 0) — точки упора, и сколько снимков всего
function drawProbe(s){
  const e = s.probe;
  if(!on.pano || !e || playT - e.t > 60000) return;
  const naz = e.naz, elev = String(e.elev).split(',').map(Number), row = elev.indexOf(0);
  if(row < 0) return;
  const hits = e.hits.split(',').slice(row*naz, (row+1)*naz);
  const c = w2s(e.ox, e.oz);
  ctx.strokeStyle='rgba(255,64,129,0.5)'; ctx.fillStyle='#ff4081'; ctx.lineWidth=1;
  hits.forEach((h,i)=>{
    const d = +h.split(':')[0], a = 2*Math.PI*i/naz, dd = d < 0 ? 150 : d;
    const p = w2s(e.ox + Math.cos(a)*dd, e.oz + Math.sin(a)*dd);
    ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    if(d >= 0){ ctx.fillRect(p.x-2,p.y-2,4,4); }
  });
  ctx.font=fnt(11,1);
  ctx.fillText(`эхолот: снимков ${s.probeN}`, c.x+6, c.y-6);
}

const MODE_GLYPH = { hold:'▣', scout:'➚', regroup:'⟲', guard:'⟲', holdout:'⌂', front:'═', bound:'»', withdraw:'«', idle:'·' };

// Отряды на карте: центр, верхний боец, фракция, живые бойцы
function squadGroups(s, alive){
  const groups = {};
  for(const [id,npc] of Object.entries(s.npcs)){
    if(!alive(npc)) continue;
    const g = groups[npc.sq] ||= {x:0, z:0, n:0, zmax:-1e9, comm:npc.comm, members:[]};
    g.x += npc.px; g.z += npc.pz; g.n++; g.zmax = Math.max(g.zmax, npc.pz); g.members.push(npc);
  }
  return groups;
}

  probe:'#ff4081', probe_mode:'#ff4081', intel:'#998', play_start:'#aed581', play_end:'#8d6e63', wpn_switch:'#998', match_start:'#fff', match_end:'#fff', death:'#9e9e9e', holdout_start:'#ff7043', holdout_end:'#8d6e63',
  regroup_start:'#a5d6a7', all_clear:'#69f0ae', post_end:'#557', scout_arrive:'#b4a0ff', regroup_spot:'#81c784',
  bel_seed:'#c86bff', bel_end:'#8e5bb0', clear_start:'#c86bff', clear_role:'#e0b3ff', clear_post:'#f2c14e', clear_fire:'#ff5252', clear_step:'#e0b3ff', clear_end:'#557',
  dir_plan:'#00e5ff',    flank_pick:'#00e5ff',  flank_arrive:'#00bcd4', flank_none:'#557',  scout_go:'#b4a0ff',
};

function fmtEv(e){
  const col  = EV_COLORS[e.ev] || '#666';
  const ts   = e.t!=null ? (e.t/1000).toFixed(1)+'s' : '';
  const nstr = e.npc ? `<span style="color:#7d7763">n${e.npc}</span> ` : '';
  const sqstr= e.sq  ? `<span style="color:#5d5a4a">sq${e.sq}</span> ` : '';
  let d='';
  if(e.ev==='search_node'||e.ev==='hold_enter') d=` vid=${e.vid} w=${(e.w||0).toFixed(2)}${e.mode?' '+e.mode:''}`;
  else if(e.ev==='node_checked'||e.ev==='lot_claim') d=` vid=${e.vid}`;
  else if(e.ev==='belief_kill')  d=` reason=${e.reason||'?'}`;
  else if(e.ev==='bel_seed')     d=` потеряли n${e.eid} (${e.why==='lost'?'из виду':'весть движка'}, ${((e.age||0)/1000).toFixed(1)} с назад)`;
  else if(e.ev==='bel_end')      d=` n${e.eid}: ${BEL_END[e.why]||e.why} — вычеркнули ${Math.round((e.eaten||0)*100)}%, ушёл ${Math.round((e.lost||0)*100)}%`;
  else if(e.ev==='clear_role')   d=e.role==='hold' ? ' держит край' : ' заглядывает';
  else if(e.ev==='clear_post')   d=e.role==='peek' ? ` сел у угла, ждёт ${((e.wait||0)/1000).toFixed(0)} с` : ' сел держать край';
  else if(e.ev==='clear_step')   d=' терпение кончилось — шаг за угол';
  else if(e.ev==='clear_fire')   d=` нашёл n${e.enemy} первым — бьёт с места`;
  else if(e.ev==='alert_hear')   d=` ${e.stype||''} who=${e.who||0}`;
  else if(e.ev==='alert_corpse') d=` corpse=${e.cid}`;
  else if(e.ev==='watch_lost')   d=` bel=${e.bel} echo=${e.echo}`;
  else if(e.ev==='search_start') d=` ${rankName(e.rank||0)}`;
  else if(e.ev==='bark')         d=` «${e.theme}»`;
  else if(e.ev==='kw_fire')      d=` → n${e.victim} с ${(e.d||0).toFixed(1)} м`;
  else if(e.ev==='dir_plan')     d=` ${e.preset}/${e.mode} ${e.roles||''}`;
  else if(e.ev==='cmd_ok'||e.ev==='cmd_fail') d=` #${e.seq} ${e.cmd} ${e.info||''}`;
  else if(e.ev==='spawned')      d=` sq${e.sq} ${e.section} ×${e.n}${e.ranks ? ' · ранги '+String(e.ranks).split(',').map(r=>rankName(+r)).join(', ') : ''}`;
  else if(e.ev==='flank_pick')   d=` vid=${e.vid} sep=${(e.w||0).toFixed(2)}`;
  else if(e.ev==='regroup_start') d=` ${((e.dur||0)/1000).toFixed(0)} с, кэп n${e.cap}, мораль ${(e.moral||0).toFixed(2)} ${MSTATE[e.mstate]||''}`;
  else if(e.ev==='all_clear')    d=` разведка: ${e.scouts||'—'}`;
  else if(e.ev==='post_end')     d=` ${e.reason||''}`;
  else if(e.ev==='holdout_start') d=` убежище x=${(+e.ax).toFixed(0)} z=${(+e.az).toFixed(0)} стены ${((e.enc||0)*100).toFixed(0)}%, мораль ${(e.moral||0).toFixed(2)} ${MSTATE[e.mstate]||''}`;
  else if(e.ev==='holdout_end')  d=` ${e.reason||''}`;
  else if(e.ev==='intel')        d=` узнал у n${e.enemy}: ${e.sec}${e.cls?' — '+e.cls+'!':''} (${e.how}${e.shared?', всем':', лично'})`;
  else if(e.ev==='play_start')   d=` ${MODE_NAMES[e.play]||e.play} (${e.reason||''}), бойцов ${e.n}`;
  else if(e.ev==='play_end')     d=` ${MODE_NAMES[e.play]||e.play}: ${e.reason||''}`;
  else if(e.ev==='wpn_switch')   d=` ${e.from||'—'} → ${e.to} на ${(+e.d).toFixed(0)} м`;
  else if(e.ev==='match_start')  d=` ${e.id} A ${e.a} против B ${e.b}, ${e.limit} с`;
  else if(e.ev==='match_end')    d=` ${e.id} ${e.reason}, живых ${e.alive_a}:${e.alive_b}, точка ${(+e.ctrl_a).toFixed(0)}:${(+e.ctrl_b).toFixed(0)} с`;
  else if(e.ev==='death')        d=` убил n${e.killer}`;
  else if(e.ev==='probe')        d=` ${e.level||''} vid=${e.vid} x=${(+e.ox).toFixed(1)} z=${(+e.oz).toFixed(1)}`;
  else if(e.ev==='probe_mode')   d=e.on ? ' вкл' : ' выкл';
  else if(e.ev==='regroup_spot') d=` vid=${e.vid} открыт ${(e.open||0).toFixed(2)}`;
  return `<div class="ev"><span style="color:#4a4638">${ts} </span>${nstr}${sqstr}`+
         `<span style="color:${col}">${e.ev}</span><span style="color:#8a846f">${d}</span></div>`;
}

function setStatus(t){ document.getElementById('status').textContent = t; }

function refresh(){
  const scrub = document.getElementById('scrub');
  scrub.min = t0; scrub.max = tMax; scrub.value = playT;
  document.getElementById('scrub-label').textContent =
    `${(playT/1000).toFixed(1)} / ${(tMax/1000).toFixed(1)} с`;
  draw();
  renderRoster();
  const el = document.getElementById('eventlog');
  el.innerHTML = S.evLog.map(fmtEv).join('');
  el.scrollTop = el.scrollHeight;
  const alive = Object.values(S.npcs).filter(n=>playT-n._t<=3000).length;
  setStatus(`${L ? levelName(L.meta.name) : 'уровень не узнан'} · событий ${S.upto}/${allEvents.length} · ` +
            `бойцов ${alive} · вер ${Object.keys(S.beliefs).length}`);
}

function setButtons(){
  document.getElementById('live-btn').className = isLive ? 'on' : '';
  document.getElementById('play-btn').textContent = isPlaying ? '❚❚' : '▶';
}
function goLive(){ isLive = true; isPlaying = false; playT = tMax; setButtons(); refresh(); }

// Следить за матчем (21.10): начался новый матч (передислокация) — карта сама переезжает к его
// точке, ±80 м вокруг (юзер: ±130 — слишком далеко). Руками двигать можно — до
// следующего матча.
let followMatch = true, followedId = null;
function toggleFollow(){
  followMatch = !followMatch;
  document.getElementById('follow-btn').className = followMatch ? 'on' : '';
  if(followMatch){ followedId = null; followNewMatch(); }
}
// 22.10: без «в эфире» — раньше слежение молча умирало после любого ползунка/повтора (в 3D так не было)
function followNewMatch(){
  if(!followMatch || !cv.width) return;
  let m = null;
  for(let i = allEvents.length - 1; i >= 0; i--){
    if(allEvents[i].ev === 'match_start'){ m = allEvents[i]; break; }
  }
  if(!m || m.id === followedId) return;
  followedId = m.id;
  fitBox(m.zx - 80, m.zx + 80, m.zz - 80, m.zz + 80);
}
function onScrub(v){ isLive = false; playT = v; setButtons(); refresh(); }
function togglePlay(){
  isLive = false;
  if(!isPlaying && playT >= tMax) playT = t0;  // с конца — повтор с начала
  isPlaying = !isPlaying; setButtons();
}

let lastFrame = performance.now();
function tick(now){
  const dt = now - lastFrame; lastFrame = now;
  if(isPlaying){
    playT = Math.min(tMax, playT + dt * +document.getElementById('speed').value);
    if(playT >= tMax){ isPlaying = false; setButtons(); }
    refresh();
  }
  requestAnimationFrame(tick);
}

// МОСТ: опрос trace из игры
// ─────────────────────────────────────────────
let lastLen = 0;

async function poll(){
  try{
    const r = await fetch('/log?t='+Date.now());
    if(r.ok && r.status!==204){
      const text = await r.text();
      if(text.length !== lastLen){
        const restarted = text.length < lastLen;  // файл перезаписан — новая игра
        lastLen = text.length;
        allEvents.length = 0;
        for(const line of text.split('\n')){
          const l = line.trim(); if(!l) continue;
          try{ const e = JSON.parse(l); if(e.t!=null) allEvents.push(e); }catch(_){}
        }
        t0 = allEvents.length ? allEvents[0].t : 0;
        tMax = allEvents.length ? allEvents[allEvents.length-1].t : 0;
        S = freshState();
        if(restarted || !L || (levelChoice==='auto' && guessLevel() && guessLevel()!==L.meta.name)) await pickLevel(levelChoice);
        if(!view) fitFight();
        if(isLive) playT = tMax;
        followNewMatch();
        refresh();
        autoSelectSpawned(); updateSelInfo(); if(sent.length) renderCmdLog();
      }
    }
  }catch(e){ setStatus('ошибка: '+e.message+' — сервер запущен?'); }
  setTimeout(poll, 500);
}

let tool = 'select';
let sel = null;              // {kind:'sq'|'npc', id}
const sent = [];             // [{seq, cmd, args, at}] — наши команды, ответ ищем в trace
const marks = {};            // цель → {x, z, kind, hard}: куда приказали (рисуем флажок)
let lastOkSeen = 0;          // сколько cmd_ok/cmd_fail уже обработали (для автовыбора после спавна)

const HINTS = {
  select:  'клик по бойцу — выбрать его отряд, Shift+клик — одного бойца. ПКМ по карте — «идти» для выбранных.',
  spawn:   'клик по карте — отряд появится там и будет стоять (на бой реагирует как обычно).',
  move:    'клик — выбранные идут туда и встают. «Сквозь бой» — не отвлекаются на врага по дороге.',
  hold:    'клик — встать в точке и держать её.',
  attack:  'клик по бойцу — выбранные получают его во враги.',
  hostile: 'клик по бойцу другого отряда — два отряда становятся врагами друг другу.',
  tp:      'клик — перенести тебя (актёра) в точку. Удобно подойти посмотреть.',
};
function setTool(t){
  tool = t;
  for(const b of document.querySelectorAll('#tools button')) b.classList.toggle('on', b.dataset.tool===t);
  document.getElementById('hint').textContent = HINTS[t] || '';
}
for(const b of document.querySelectorAll('#tools button')) b.onclick = ()=>setTool(b.dataset.tool);
setTool('select');

async function send(cmd, args){
  try{
    const r = await fetch('/cmd', {method:'POST', body: JSON.stringify({cmd, args})});
    const j = await r.json();
    if(j.seq){ sent.push({seq:j.seq, cmd, args, at:Date.now()}); renderCmdLog(); }
    else setStatus('сервер не принял команду: '+(j.error||r.status));
    return j.seq;
  }catch(e){ setStatus('нет связи с сервером: '+e.message); }
}

function selTarget(){ return sel ? `${sel.kind}:${sel.id}` : null; }
function selCmd(cmd){
  const t = selTarget();
  if(!t){ setStatus('сначала выбери отряд или бойца'); return; }
  if(cmd==='preset'){
    if(sel.kind!=='sq'){ setStatus('пресет задаётся отряду, не бойцу'); return; }
    send('preset', [t, document.getElementById('sel-preset').value]);
  } else {
    send(cmd, [t]);
    if(cmd==='free') delete marks[t];
    if(cmd==='remove'||cmd==='kill'){ delete marks[t]; sel = null; updateSelInfo(); }
  }
}

// ответ игры: последний cmd_ok/cmd_fail с этим seq (после отправки)
function replyFor(c){
  for(let i=allEvents.length-1;i>=0;i--){
    const e = allEvents[i];
    if((e.ev==='cmd_ok'||e.ev==='cmd_fail') && e.seq===c.seq) return e;
  }
  return null;
}
function renderCmdLog(){
  const el = document.getElementById('cmdlog');
  el.innerHTML = sent.slice(-12).reverse().map(c=>{
    const r = replyFor(c);
    const cls = !r ? 'wait' : r.ev==='cmd_ok' ? 'ok' : 'fail';
    const st  = !r ? ((Date.now()-c.at > 5000) ? 'нет ответа — игра запущена? varka_cmd загружен?' : 'ждём игру…') : (r.info||'');
    return `<div class="${cls}">#${c.seq} ${c.cmd} ${c.args.join(' ')} — ${st}</div>`;
  }).join('');
}

// после спавна сразу выбираем новый отряд — можно тут же отдавать приказы
function autoSelectSpawned(){
  const replies = allEvents.filter(e=>e.ev==='cmd_ok' && e.cmd==='spawn');
  if(replies.length <= lastOkSeen){ lastOkSeen = replies.length; return; }
  const last = replies[replies.length-1];
  lastOkSeen = replies.length;
  const m = /^sq:(\d+)$/.exec(last.info||'');
  if(m && sent.some(c=>c.seq===last.seq)){ sel = {kind:'sq', id:+m[1]}; updateSelInfo(); }
}

function npcAtScreen(px, py){
  let best = null, bd = 14;
  for(const [id,npc] of Object.entries(S.npcs)){
    if(playT - npc._t > 3000) continue;
    const p = w2s(npc.px, npc.pz), d = Math.hypot(p.x-px, p.y-py);
    if(d < bd){ bd = d; best = {id:+id, npc}; }
  }
  return best;
}

function updateSelInfo(){
  const el = document.getElementById('sel-info');
  if(!sel){ el.textContent = 'ничего не выбрано'; return; }
  const members = Object.entries(S.npcs).filter(([id,n])=> playT-n._t<=3000 && (sel.kind==='sq' ? n.sq===sel.id : +id===sel.id));
  const comm = members[0] ? members[0][1].comm : '?';
  el.textContent = sel.kind==='sq' ? `отряд sq:${sel.id} · ${comm} · бойцов ${members.length}` : `боец npc:${sel.id} · ${comm}`;
  renderRoster(true);
}

function mapClick(e, right){
  if(!view) return;
  if(!right){
    const b = badgeHits.find(b=>e.offsetX>=b.x0 && e.offsetX<=b.x1 && e.offsetY>=b.y0 && e.offsetY<=b.y1);
    if(b){ sel = {kind:'sq', id:b.sq}; updateSelInfo(); renderRoster(true); draw(); return; }
  }
  const w = s2w(e.offsetX, e.offsetY), node = nodeAt(w.x, w.z), hit = npcAtScreen(e.offsetX, e.offsetY);
  const t = right ? 'move' : tool;
  const hard = document.getElementById('ord-hard').checked ? '1' : '0';

  if(t==='select'){
    sel = hit ? (e.shiftKey ? {kind:'npc', id:hit.id} : {kind:'sq', id:hit.npc.sq}) : null;
    updateSelInfo(); draw(); return;
  }
  if(t==='attack' || t==='hostile'){
    if(!sel){ setStatus('сначала выбери, кто атакует'); return; }
    if(!hit){ setStatus('кликни по бойцу'); return; }
    if(t==='attack') send('attack', [selTarget(), String(hit.id)]);
    else send('hostile', [selTarget(), `sq:${hit.npc.sq}`]);
    return;
  }
  if(!node){ setStatus('там нет ноды навмеша — туда нельзя'); return; }
  if(t==='spawn'){
    const f = document.getElementById('sp-faction').value, lv = document.getElementById('sp-level').value;
    send('spawn', [`${f}_sim_squad_${lv}`, String(node.vid), document.getElementById('sp-n').value,
                   document.getElementById('sp-ghost').checked ? '1' : '0']);
    return;
  }
  if(t==='tp'){ send('tp', [String(node.vid)]); return; }
  if(t==='move' || t==='hold'){
    const target = selTarget();
    if(!target){ setStatus('сначала выбери отряд или бойца'); return; }
    send('order', [target, t, String(node.vid), hard]);
    marks[target] = {x:w.x, z:w.z, kind:t, hard:hard==='1'};
    draw();
  }
}

function drawCreative(s, alive){
  // выбранные — бирюзовое кольцо
  if(sel){
    for(const [id,npc] of Object.entries(s.npcs)){
      if(!alive(npc)) continue;
      if(sel.kind==='sq' ? npc.sq!==sel.id : +id!==sel.id) continue;
      const p = w2s(npc.px, npc.pz);
      ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2);
      ctx.strokeStyle='#d68a35'; ctx.lineWidth=2; ctx.stroke();
    }
  }
  // флажки приказов: куда отправили (жёсткий — красный)
  for(const [target,m] of Object.entries(marks)){
    const p = w2s(m.x, m.z), col = m.hard ? '#ff5252' : '#d68a35';
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y-18); ctx.lineTo(p.x+11, p.y-14); ctx.lineTo(p.x, p.y-10); ctx.closePath(); ctx.fill();
    ctx.font=fnt(10); ctx.fillText(`${target} ${m.kind==='move'?'идти':'стоять'}${m.hard?' !':''}`, p.x+13, p.y-12);
  }
}

const AXES = [['coh','спл','сплочённость: вес живых / вес в начале'], ['inf','влн','влияние: доля бойцов, кто может ответить'],
              ['cap','кэп','вертикаль: жив ли старший'], ['fog','тум','туман: огонь от невидимого (больше — хуже)'],
              ['res','зап','запас храбрости (Моран)'], ['wall','стн','стены вокруг бойцов (запечка зрения)'],
              ['heavy','тяж','у врага известный отряду пулемёт/гранатомёт (давит на мораль)'],
              ['wear','изн','износ: сколько угрозы смерти отряд в среднем пропустил через себя (больше — хуже)']];

function renderRoster(force){
  if(!rosterOn) return;
  const now = performance.now();
  if(!force && now - rosterAt < 250) return;
  rosterAt = now;
  const s = S, alive = n => playT - n._t <= 3000;
  const bySq = {};
  for(const [id,n] of Object.entries(s.npcs)){
    if(playT - n._t > 60000) continue;   // давно пропавших не держим
    (bySq[n.sq] ||= []).push([id,n]);
  }
  const html = [`<div class="legend">`+
    strapLegendHTML(18)+
    `<span class="star">★</span> командир отряда · ✚ ранен · ! опасность · ⚔ добивает · ◎ видит цель · ○ помнит<br>`+
    `режим дирижёра: ▣ держат · ➚ разведка · ⟲ перегруппировка · ⌂ засели<br>`+
    `мораль: <span style="color:${MSTATE_COL.steady}">твёрд</span> · <span style="color:${MSTATE_COL.shaken}">шаток</span> · <span style="color:${MSTATE_COL.broken}">сломлен</span>, белая черта — куда тянет</div>`];
  if(!Object.keys(bySq).length)
    html.push(`<div class="legend" style="border:none">Здесь появятся отряды, как только бойцы выйдут в онлайн рядом с тобой.</div>`);
  // 22.10: пара текущего матча — сверху (A, потом B), как в 3D; чужие отряды без живых (убраны уборкой
  // после прошлого боя) не показываем, а не держим ещё минуту
  const m = s.match, sideOf = sq => !m ? 0 : m.a.includes(+sq) ? 1 : m.b.includes(+sq) ? 2 : 3;
  const order = Object.keys(bySq)
    .filter(sq => sideOf(sq) < 3 || bySq[sq].some(([,n])=>alive(n)))
    .sort((x,y)=> sideOf(x)-sideOf(y) || x.localeCompare(y));
  for(const sq of order){
    const ms = bySq[sq], pl = s.plans[sq], m = s.moral[sq];
    const live = ms.filter(([,n])=>alive(n)).length;
    const comm = ms[0][1].comm, isSel = sel && sel.kind==='sq' && sel.id===+sq;
    const mv = m==null ? null : (typeof m==='object' ? m : {v:+m});
    let h = `<div class="sq${isSel?' sel':''}" data-sq="${sq}"><div class="hd">${patchHTML(comm)}`+
      `<span class="who"><b style="color:${fcolor(comm)}">${FACTION_RU[comm] || comm}</b><small>отряд ${sqShort(sq)}</small></span>`+
      (pl ? `<span class="mode" title="${MODE_NAMES[pl.mode]||pl.mode}">${MODE_GLYPH[pl.mode]||''} ${MODE_NAMES[pl.mode]||pl.mode}</span>` : '')+
      `<span class="count" title="живых / всего">${live}/${ms.length}</span></div>`;
    if(mv){
      const col = MSTATE_COL[mv.st] || '#00e5ff', imp = mv.imp||0;
      h += `<div class="hd" style="color:${col};margin-top:5px">мораль ${mv.v.toFixed(2)} ${mv.st?MSTATE[mv.st]:''}`+
           (Math.abs(imp)>0.003 ? ` <span style="color:${imp<0?'#ff5252':'#69f0ae'}">${imp<0?'▾':'▴'}${Math.abs(imp*60).toFixed(2)}/мин</span>` : '')+
           (mv.near ? ' <span style="color:#ff7043">прижат</span>' : '') + `</div>`+
           `<div class="mbar"><i style="width:${mv.v*100}%;background:${col}"></i>`+
           (mv.target!=null ? `<b style="left:${Math.min(99,mv.target*100)}%"></b>` : '') + `</div>`;
      if(mv.coh!=null){
        h += `<div class="axes">` + AXES.map(([k,lab,tip])=>{
          const v = mv[k]==null ? 0 : mv[k];
          return `<span title="${tip}: ${(+v).toFixed(2)}">${lab}<em><i style="width:${Math.min(100,v*100)}%;${k==='fog'||k==='wear'?'background:#c66':''}"></i></em></span>`;
        }).join('') + `</div>`;
      }
    }
    // знание об оружии врага: общее (кэп опытный+ или выкрик) и личное (кэп-новичок)
    const intel = Object.entries(s.intel[sq] || {}).filter(([eid])=>{ const e = s.npcs[eid]; return e && alive(e); });
    if(intel.length){
      const name = e => (e.cls==='mg' ? 'пулемёт ' : e.cls==='launcher' ? 'гранатомёт ' : e.cls==='sniper' ? 'снайпер ' : '') + String(e.sec||'').replace('wpn_','');
      const sh = intel.filter(([,e])=>e.shared).map(([,e])=>name(e));
      const pr = intel.filter(([,e])=>!e.shared).map(([,e])=>name(e));
      h += `<div class="intel">знают о враге: ${sh.join(', ')||'—'}`+
           (pr.length ? ` <span style="color:#6f6956">(лично: ${pr.join(', ')})</span>` : '') + `</div>`;
    }
    h += `<div class="members">`;
    // командир первым, дальше по рангу
    for(const [id,n] of ms.sort((a,b)=>(b[1].lead||0)-(a[1].lead||0) || (b[1].rank||0)-(a[1].rank||0))){
      const dead = !alive(n), isSelN = sel && sel.kind==='npc' && sel.id===+id;
      const role = s.roles[id], fl = [];
      if(n.wnd) fl.push('✚');
      if(n.dng) fl.push('!'+(n.dtype||''));
      if(n.kw) fl.push('⚔');
      if(n.be!=null && n.be>=0) fl.push((n.bsee?'◎':'○') + n.be);
      const hp = n.hp==null ? null : Math.max(0, Math.min(1, n.hp));
      h += `<div class="m${dead?' dead':''}${isSelN?' sel':''}" data-npc="${id}" title="${rankName(n.rank||0)}${n.lead?', командир отряда':''}">`+
           strapSVG(rankIdx(n.rank||0), 16) + `<span class="id">${id}</span>` +
           (n.lead && !dead ? `<span class="star">★</span>` : '') +
           (hp==null || dead ? '' : hpBarHTML(hp))+
           (n.wk && !dead ? `<span class="wpn" title="${n.wpn||''}">${WEAPON_KIND[n.wk]||n.wk}</span>` : '')+
           (role && role!=='hold' ? `<span class="role">${ROLE_NAMES[role]||role}</span>` : '')+
           `<span class="fl">${fl.join(' ')}</span>`+
           (dead ? '' : `<span class="act">${actName(n)}</span>`) + `</div>`;
    }
    h += `</div></div>`;
    html.push(h);
  }
  document.getElementById('roster').innerHTML = html.join('');
}

document.getElementById('roster').addEventListener('click', e=>{
  const m = e.target.closest('[data-npc]'), q = e.target.closest('[data-sq]');
  let pts = [];
  if(m){
    sel = {kind:'npc', id:+m.dataset.npc};
    const n = S.npcs[m.dataset.npc]; if(n) pts = [n];
  } else if(q){
    sel = {kind:'sq', id:+q.dataset.sq};
    pts = Object.values(S.npcs).filter(n=>n.sq===+q.dataset.sq && playT-n._t<=3000);
  } else return;
  if(pts.length && view){   // показать на карте, масштаб не трогаем
    view.cx = pts.reduce((a,n)=>a+n.px,0)/pts.length; view.cz = pts.reduce((a,n)=>a+n.pz,0)/pts.length;
  }
  updateSelInfo(); renderRoster(true); draw();
});

resize();
loadIndex().then(()=>{ poll(); requestAnimationFrame(tick); });
</script>
</body>
</html>
